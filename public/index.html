  <meta name="theme-color" content="#2563eb">
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

</head>
<body>
  <header class="top">
    <h1>Clip Relay</h1>
    <span id="conn" class="conn" title="連線中…" role="img" aria-label="連線狀態">●</span>
  </header>

  <div id="banner" class="banner" hidden>
    <span>有新版本可用</span>
    <button id="reload-btn" type="button">重新整理</button>
  </div>

  <main>
    <section class="card">
      <label class="sr-only" for="text-input">要傳送的文字</label>
      <textarea id="text-input" rows="5" placeholder="貼上或輸入要傳送的文字（Ctrl/⌘ + Enter 送出）" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      <div class="row between">
        <span id="size-hint" class="muted"></span>
        <button id="paste-btn" type="button" class="ghost" hidden>從剪貼簿貼上</button>
      </div>
      <div class="row wrap">
        <label class="inline">有效時間
          <select id="ttl-select"></select>
        </label>
        <label class="inline check"><input id="burn-check" type="checkbox"> 讀取一次後刪除</label>
        <button id="send-btn" type="button" class="primary push">傳送</button>
      </div>
    </section>

    <section class="card" id="drop-zone">
      <div class="row wrap">
        <button id="pick-files" type="button">選擇檔案</button>
        <button id="pick-photos" type="button">相簿照片／影片</button>
        <button id="pick-folder" type="button">選擇資料夾</button>
      </div>
      <p class="muted drop-hint">也可以把檔案或資料夾拖進來，或直接貼上圖片。使用上方的「有效時間」與「讀取一次後刪除」設定。</p>
      <input id="file-input" type="file" multiple hidden>
      <input id="photo-input" type="file" multiple accept="image/*,video/*" hidden>
      <input id="folder-input" type="file" webkitdirectory multiple hidden>
      <ul id="uploads" class="uploads"></ul>
    </section>

    <div class="row between list-head">
      <h2>歷史紀錄 <span id="count" class="muted"></span></h2>
      <button id="clear-btn" type="button" class="ghost">全部清除</button>
    </div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="muted center" hidden>目前沒有紀錄</p>
  </main>

  <dialog id="manual-dialog">
    <form method="dialog">
      <p id="manual-msg">自動複製失敗，請手動複製以下內容：</p>
      <textarea id="manual-text" rows="8" readonly></textarea>
      <div class="row"><button class="primary" value="close">關閉</button></div>
    </form>
  </dialog>

  <dialog id="preview-dialog" class="preview">
    <div id="preview-body"></div>
    <form method="dialog"><div class="row"><button class="primary" value="close">關閉</button></div></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
